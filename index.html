<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pay Sudhakar Pawar</title>
  <meta name="description" content="Pay ₹280 to Sudhakar Pawar via Google Pay / UPI">
  <style>
    :root {
      --bg: #f5f7fb; --card: #ffffff; --text: #1a1d24; --muted: #5f6673;
      --accent: #1a73e8; --accent-text: #ffffff; --border: #e2e6ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --card: #181b22; --text: #e8eaef; --muted: #9aa1ad;
        --accent: #8ab4f8; --accent-text: #0f1115; --border: #2a2f3a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px 24px; text-align: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    .upi { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; word-break: break-all; }
    .amount { font-size: 2.5rem; font-weight: 700; margin: 0 0 24px; }
    .btn {
      display: block; width: 100%; padding: 14px; border-radius: 10px; font-size: 1rem;
      font-weight: 600; text-decoration: none; margin-bottom: 10px;
    }
    .primary { background: var(--accent); color: var(--accent-text); }
    .secondary { border: 1px solid var(--border); color: var(--text); }
    .qr { margin: 20px auto 8px; width: 200px; height: 200px; background: #fff; padding: 8px; border-radius: 8px; }
    .qr img { width: 100%; height: 100%; display: block; }
    .hint { color: var(--muted); font-size: 0.85rem; margin: 0; }
    .copy { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.85rem; padding: 4px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sudhakar Pawar</h1>
    <p class="upi">9850672020@ybl <button class="copy" id="copy" type="button">Copy</button></p>
    <p class="amount">₹280</p>

    <a class="btn primary" id="gpay" href="#">Pay with Google Pay</a>
    <a class="btn secondary" id="upi" href="#">Pay with any UPI app</a>

    <div class="qr"><img src="upi-qr.svg" alt="UPI QR code to pay ₹280 to Sudhakar Pawar"></div>
    <p class="hint">On desktop? Scan with any UPI app.</p>
  </main>

  <script>
    const PARAMS = "pa=9850672020@ybl&pn=Sudhakar%20Pawar&am=280.00&cu=INR&tn=Payment";
    const upiLink = "upi://pay?" + PARAMS;
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    // Android: intent targets Google Pay directly. iOS: GPay's own scheme.
    const gpayLink = isAndroid
      ? "intent://pay?" + PARAMS + "#Intent;scheme=upi;package=com.google.android.apps.nbu.paisa.user;end"
      : isIOS ? "gpay://upi/pay?" + PARAMS : upiLink;

    document.getElementById("gpay").href = gpayLink;
    document.getElementById("upi").href = upiLink;

    document.getElementById("copy").addEventListener("click", async (e) => {
      try {
        await navigator.clipboard.writeText("9850672020@ybl");
        e.target.textContent = "Copied";
      } catch {
        e.target.textContent = "Copy failed";
      }
    });
  </script>
</body>
</html>
